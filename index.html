<!DOCTYPE html>
<html>
<head>
<title>Valentine</title>
<style>
body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff9a9e,#fad0c4);
font-family:Arial;
}
.box{
background:white;
padding:30px;
border-radius:15px;
text-align:center;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}
h1{
color:#ff4d6d;
margin-bottom:10px;
}
button{
font-size:18px;
padding:10px 25px;
border:none;
border-radius:10px;
cursor:pointer;
}
#yes{
background:#ff4d6d;
color:white;
}
#no{
background:#ccc;
position:absolute;
}
</style>
</head>
<body>

<div class="box">
<h1>NITU JIIIII ❤️</h1>
<h2>Can you please be my Valentine? 💖</h2>
<button id="yes" onclick="yesClick()">Yes</button>
<button id="no" onmouseover="moveNo()">No</button>
</div>

<script>
function moveNo(){
let x=Math.random()*(window.innerWidth-100);
let y=Math.random()*(window.innerHeight-100);
no.style.left=x+"px";
no.style.top=y+"px";
}
function yesClick(){
alert("Yayyy! 💕 Happy Valentine’s Day!");
}
</script>

</body>
</html>
